# cargo-deny owns resolved supply-chain policy for the workspace.
# Run: `cargo deny check`.
#
# Family dependencies are published on crates.io; no Git source exception is required, with one
# deliberate, temporary exception: cadw-contract (see allow-git below).

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# cadw-contract is unpublished (0.0.0, Tier 2). Adopted via git while this integration proves out
# through real usage and dogfooding, per the agreed sequencing: once that holds, cadw publishes
# 0.1.0 and Cargo.toml/this line both revert to the normal published-version pattern every other
# family dependency already uses.
allow-git = ["https://github.com/tacticaldoll/cadw"]
